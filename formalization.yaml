# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "Singh Theorem: variance of log-derivative differences at small CUE gaps"
  description: >-
    For a Haar-random unitary matrix in U(N), the conditional variance of
    log|Λ'(θ₁)| - log|Λ'(θ₂)| for an adjacent pair of eigenangles at normalized
    gap s, where Λ is the characteristic polynomial, equals c_N s² (1 + o(1)) as
    s → 0⁺ with c_N = (π²/15)(1 - 4/N²). The proof conditions on the pair through
    the Weyl density, linearizes by dominated convergence, maps the resulting
    circle weight to the Hua (Cauchy) ensemble by the Cayley transform, and
    evaluates the second moment there from two loop equations proved by
    integration by parts.
  # Required nonempty list of name strings or mappings with a nonempty name.
  authors:
    - "Jaskirat Singh"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jaskirat Singh"

classification:
