    type: "paper"
    relationship: "formalizes"
    note: "Original theorem and proof by Jaskirat Singh; this repository is its full Lean 4 proof."
    author_endorsement: "participated"
  - title: "Harmonic Analysis of Functions of Several Complex Variables in the Classical Domains"
    authors:
