fidelity:
  divergences: >-
    The conditional law is given by its explicit density: chord lengths
    |e^{ia} - e^{ib}| are written as 2|sin((a-b)/2)| (proved as
    Singh.norm_exp_sub_exp) and constant factors are dropped, which cancel in
    the variance. By rotation invariance the pair is placed at ∓δ/2. The passage
    from Haar measure on U(N) to the Weyl density is taken as the classical Weyl
    integration formula.

