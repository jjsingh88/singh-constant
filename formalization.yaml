status:
  scope: >-
    Formalized: the conditional variance cueV N s of log|Λ'(θ₁)| - log|Λ'(θ₂)|
    under the explicit Weyl conditional density of the remaining N-2 eigenangles
    given an adjacent pair at gap 2πs/N (restricted to the complementary arc),
    and the limits cueV N s / s² → (π²/15)(1 - 4/N²) and
    cueV N s = c_N s² + o(s²) as s → 0⁺, for every N ≥ 2. The Weyl conditional
    density is the stated model; deriving it from Haar measure on U(N) inside
    Lean is the classical Weyl integration formula and is not part of this entry.
